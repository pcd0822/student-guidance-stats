# 깨끗한 윈도우·맥에서 설치 → Python 자동 설치 → 테스트 → 앱 서버가 뜨는지 확인한다.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GS_SOURCE: ${{ github.workspace }}
      GS_NORUN: "1"
      GS_NOSHORTCUT: "1"
      GS_FORCE_MANAGED: "1"   # 이미 깔린 Python 을 쓰지 않고 uv 로 최신판을 받는 길을 시험
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      # job 수준 env 에서는 runner 문맥을 쓸 수 없어 여기서 설치 위치를 정한다
      - name: 설치 위치 정하기
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "GS_DEST=$env:RUNNER_TEMP\GuidanceStats"
      - name: installer\install.bat (로컬 원본으로 복사)
        shell: cmd
        run: installer\install.bat
      - name: 두 번째 실행 = 업데이트(자료 보존 확인)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GS_DEST\data" | Out-Null
          Set-Content "$env:GS_DEST\data\keep.txt" "keep"
          cmd /c installer\install.bat
          if (-not (Test-Path "$env:GS_DEST\data\keep.txt")) { throw "data 폴더가 지워졌습니다" }
      # 학교 컴퓨터처럼 컴파일러(Visual Studio)를 찾지 못하게 한다 — 소스 빌드가 일어나면 실패해야 한다
      - name: 컴파일러 숨기기(학교 컴퓨터 흉내)
        shell: pwsh
        run: |
          $vw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vw) { Rename-Item $vw 'vswhere.exe.hidden' }
          if (Test-Path $vw) { throw "vswhere 를 숨기지 못했습니다" }
      - name: bootstrap.ps1 (uv 로 Python 최신판 자동 설치 + 패키지)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "%GS_DEST%\scripts\bootstrap.ps1"
      - name: 패키지가 없는 Python 이 이미 깔린 상태에서 다시 실행 → 3.13 으로 바꿔야 함
        shell: pwsh
        working-directory: ${{ env.GS_DEST }}
        run: |
          $v = (& .venv\Scripts\python.exe -c "import sys; print('%d.%d' % sys.version_info[:2])").Trim()
          Write-Host "지금 Python: $v"
          if ($v -eq '3.13') { Write-Host '이미 3.13 이라 이 시험은 건너뜁니다'; exit 0 }
          Remove-Item .venv\.requirements.sha256 -ErrorAction SilentlyContinue
          $env:GS_SIMULATE_NO_WHEEL = $v
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { throw "bootstrap 실패($LASTEXITCODE)" }
          $after = (& .venv\Scripts\python.exe -c "import sys; print('%d.%d' % sys.version_info[:2])").Trim()
          if ($after -ne '3.13') { throw "3.13 으로 바뀌지 않았습니다: $after" }
          & .venv\Scripts\python.exe -c "import uvicorn, fastapi, lxml, openpyxl; print('패키지 OK')"
          if ($LASTEXITCODE -ne 0) { throw "패키지가 없습니다" }
      - name: 테스트
        shell: cmd
        working-directory: ${{ env.GS_DEST }}
        run: |
          .venv\Scripts\python.exe --version
          .venv\Scripts\python.exe -m pip install -q --prefer-binary --only-binary=lxml,pydantic-core,cffi -r requirements-dev.txt
          .venv\Scripts\python.exe -m pytest -q
      - name: 앱 서버 확인
        shell: pwsh
        working-directory: ${{ env.GS_DEST }}
        run: |
          $p = Start-Process -PassThru -FilePath .venv\Scripts\python.exe -ArgumentList '-m','app','--no-open','--port','8765' -RedirectStandardOutput out.log -RedirectStandardError err.log
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/health; if ($r.ok) { $ok = $true; break } } catch { Start-Sleep 1 } }
          $html = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/).Content
          Stop-Process $p.Id -Force
          Get-Content out.log, err.log
          if (-not $ok -or $html -notmatch 'id="root"') { throw "앱 서버가 뜨지 않았습니다" }
      # 실제 앱 창(pywebview + WebView2)을 열어 화면이 그려지고 창 기능이 이어지는지 확인 후 닫는다
      - name: 앱 창 자체 시험
        shell: cmd
        working-directory: ${{ env.GS_DEST }}
        run: .venv\Scripts\python.exe -m app --window-selftest 60

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GS_FORCE_MANAGED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: start.sh (uv 로 Python 자동 설치) + 앱 서버 확인
        run: |
          export APP_DATA_DIR="$RUNNER_TEMP/appdata"
          ./start.sh --no-open --port 8765 > run.log 2>&1 &
          for i in $(seq 1 300); do curl -sf http://127.0.0.1:8765/api/health && break; sleep 1; done
          cat run.log
          curl -sf http://127.0.0.1:8765/api/health
      - name: 테스트
        run: |
          .venv/bin/python -m pip install -q -r requirements-dev.txt
          .venv/bin/python -m pytest -q
      - name: 앱 창 자체 시험
        run: |
          export APP_DATA_DIR="$RUNNER_TEMP/appdata"
          .venv/bin/python -m app --window-selftest 60
